[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trusted-data-synthesis"
version = "1.0.0"
description = "Domain-agnostic evidence, task, trajectory, and quality synthesis framework."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
finance = ["pyarrow>=16.0.0", "sympy>=1.13.0,<2"]
online = ["httpx>=0.28.1,<1"]
research = [
    "httpx>=0.28.1,<1",
    "numpy>=1.26,<3",
    "pandas>=2,<4",
    "scipy>=1.14,<2",
    "sympy>=1.13,<2",
    "tqdm>=4.66,<5",
]
training = [
    "accelerate>=1.7.0,<2",
    "datasets>=3.6.0,<4",
    "peft>=0.15.0,<1",
    "safetensors>=0.8.0,<1",
    "sentencepiece>=0.2.0,<1",
    "torch>=2.7.0,<3",
    "transformers>=5.14.1,<6",
]
serving = [
    "transformers[serving]>=5.14.1,<6",
]
dev = [
    "mypy>=1.10.0",
    "pyarrow>=16.0.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
trusted-synthesis = "trusted_synthesis.cli:main"
vtdo-finance = "trusted_synthesis.finance_research.cli:main"

[tool.setuptools.package-data]
"trusted_synthesis.finance_research.metric_vendor" = ["*.json", "*.LICENSE"]

[tool.setuptools.data-files]
"share/trusted-data-synthesis/bigfinance" = ["vendor/bigfinance/LICENSE", "vendor/bigfinance/PROVENANCE.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trusted_synthesis*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
follow_imports = "skip"
exclude = ["tests"]
