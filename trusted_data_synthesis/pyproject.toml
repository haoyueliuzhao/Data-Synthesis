[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trusted-data-synthesis"
version = "0.2.0"
description = "Domain-agnostic evidence, task, trajectory, and quality synthesis framework."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
finance = ["pyarrow>=16.0.0"]
dev = [
    "pyarrow>=16.0.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
trusted-synthesis = "trusted_synthesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trusted_synthesis*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
