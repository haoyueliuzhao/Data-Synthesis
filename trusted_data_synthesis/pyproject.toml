[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trusted-data-synthesis"
version = "0.9.0"
description = "Domain-agnostic evidence, task, trajectory, and quality synthesis framework."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
finance = ["pyarrow>=16.0.0"]
training = [
    "accelerate>=1.7.0,<2",
    "datasets>=3.6.0,<4",
    "peft>=0.15.0,<1",
    "safetensors>=0.8.0,<1",
    "sentencepiece>=0.2.0,<1",
    "torch>=2.7.0,<3",
    "transformers>=5.14.1,<6",
]
dev = [
    "mypy>=1.10.0",
    "pyarrow>=16.0.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
trusted-synthesis = "trusted_synthesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trusted_synthesis*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
follow_imports = "skip"
exclude = ["tests"]
