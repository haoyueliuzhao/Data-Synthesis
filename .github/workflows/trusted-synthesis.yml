name: trusted-synthesis

on:
  push:
    paths:
      - "trusted_data_synthesis/**"
      - ".github/workflows/trusted-synthesis.yml"
  pull_request:
    paths:
      - "trusted_data_synthesis/**"
      - ".github/workflows/trusted-synthesis.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: trusted_data_synthesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: trusted_data_synthesis/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format contract
        run: ruff format --check src tests
      - name: Type check
        run: mypy src/trusted_synthesis
      - name: Test contracts and mutations
        run: pytest -q
      - name: Generalization boundary audit
        run: trusted-synthesis audit-generalization --source-root src
      - name: Compile
        run: python -m compileall -q src tests
